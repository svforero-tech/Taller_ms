<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Sprints</title>
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/msg.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="inicio-body">
    <div id="toastContainer" class="toast-container"></div>

    <div class="app-sidebar-layout">
        <aside class="inicio-sidebar">
            <div class="inicio-brand">
                <div class="inicio-avatar" aria-hidden="true">HU</div>
                <h2>Gestor de Historias</h2>
                <p>Organiza tus tareas por periodos de trabajo</p>
            </div>

            <nav class="inicio-nav" aria-label="Menú principal">
                <a href="../intro/index.html" class="inicio-btn inicio-btn-outline">Inicio</a>
                <a href="nueva_historia.html" class="inicio-btn inicio-btn-outline">+ Nueva historia</a>
                <a href="sprints.html" class="inicio-btn inicio-btn-outline active">+ Nuevo sprint</a>
                <a href="index.html" class="inicio-btn inicio-btn-outline">Tablero de Historias</a>
            </nav>
        </aside>

        <main class="app-sidebar-content container">
            <section class="card">
                <h2>Nuevo Sprint</h2>
                <form id="formSprint">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="sprintNombre">Nombre del Sprint</label>
                            <input type="text" id="sprintNombre" required placeholder="Ej. Sprint 1">
                        </div>
                        <div class="form-group">
                            <label for="sprintInicio">Fecha Inicio</label>
                            <input type="date" id="sprintInicio" required>
                        </div>
                        <div class="form-group">
                            <label for="sprintFin">Fecha Fin</label>
                            <input type="date" id="sprintFin" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Guardar Sprint</button>
                        <a href="nueva_historia.html" class="btn btn-secondary" style="text-decoration:none;">Ir a Crear Historia</a>
                    </div>
                </form>
            </section>

            <section class="card">
                <h2>Sprints Registrados</h2>
                <div id="contenedorSprints" class="historias-list"></div>
            </section>
        </main>
    </div>

    <script type="module" src="js/historias.js"></script>
</body>
</html>
